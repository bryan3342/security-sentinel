# Local development stack for Security Sentinel.
# Brings up Redis, Postgres, and the webhook service. The analysis worker
# Dockerfile lands in M3 (needs Semgrep + git in the image); for now run
# the worker from your host via `npm run dev` inside services/analysis-worker.
#
#   docker compose up -d redis postgres        # infra only
#   docker compose up --build webhook-service  # add the webhook service
#
# Smoke test:
#   curl -X POST http://localhost:3000/healthz

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-sentinel}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
      POSTGRES_DB: ${PG_DATABASE:-security_sentinel}
    volumes:
      - sentinel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sentinel} -d ${PG_DATABASE:-security_sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 5

  webhook-service:
    build: ./services/webhook-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  sentinel-pgdata:
